<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CYBER_NUTRITION_TRACKER</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg: #050607;
            --primary: #00ff66;
            --primary-dim: #008837;
            --accent: #c82a74;
            --alert: #ff3344;
            --warning: #ffaa00;
            --border: #132a1e;
            --border-bright: #1b472e;
            --glow: rgba(0, 255, 102, 0.25);
            --glow-strong: rgba(0, 255, 102, 0.6);
            --panel-bg: rgba(4, 14, 8, 0.75);
            --font: 'JetBrains Mono', 'Courier New', monospace;
            --power-led: #00ff66;
        }

        /* Reference Image Match: Translucent Pink Game Boy Shell & Cobalt Blue Circuit Board Theme */
        body.theme-purple {
            --bg: #111827;
            --primary: #f472b6;          /* Vibrant Hot Pink */
            --primary-dim: #93c5fd;      /* Pastel Sky Blue Accent */
            --accent: #ec4899;           /* D-Pad Hot Pink */
            --alert: #f43f5e;
            --warning: #fbbf24;
            --border: rgba(244, 211, 238, 0.5);
            --border-bright: #f4d3ee;    /* Pastel Pink Bezel Rim */
            --glow: rgba(236, 72, 153, 0.4);
            --glow-strong: rgba(244, 114, 182, 0.7);
            --panel-bg: rgba(30, 58, 138, 0.88); /* Cobalt Blue Circuit Board Screen Container */
            --power-led: #ec4899;
        }

        /* 80s Beige Macintosh Platinum / Atari ST Theme */
        body.theme-beige {
            --bg: #B5B0A7; /* Muted Desktop Gray */
            --primary: #1A1A1A; /* Charcoal Ink */
            --primary-dim: #555555;
            --accent: #0044AA; /* Macintosh System Blue */
            --alert: #FF8C00; /* CRT Amber */
            --warning: #00A36C; /* Atari Emerald Green */
            --border: #1A1A1A;
            --border-bright: #0044AA;
            --glow: rgba(0, 68, 170, 0.25);
            --glow-strong: rgba(0, 163, 108, 0.5);
            --panel-bg: #E2DDD5; /* Platinum Cream */
            --power-led: #00A36C;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(200, 42, 116, 0.08) 0%, transparent 40%),
                linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            color: var(--primary);
            font-family: var(--font);
            text-transform: uppercase;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Translucent Pink Shell & Cobalt Blue PCB Layer for Reference Theme */
        body.theme-purple::after {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1e3a8a; /* Deep Cobalt Blue Circuit Board */
            background-image:
                radial-gradient(circle at 50% 20%, rgba(244, 211, 238, 0.5) 0%, rgba(232, 184, 222, 0.35) 100%),
                linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px),
                linear-gradient(0deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px),
                radial-gradient(circle at 25% 30%, rgba(37, 99, 235, 0.8) 0%, transparent 35%),
                radial-gradient(circle at 75% 70%, rgba(236, 72, 153, 0.3) 0%, transparent 40%);
            background-size: 100% 100%, 24px 24px, 24px 24px, 100% 100%, 100% 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Scanline & Liquid Caustic Overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.5;
        }

        .app-container {
            padding: 0.8rem;
            padding-top: 38px; /* Safe space for Android Status Bar */
            padding-bottom: 95px;
            max-width: 600px;
            box-sizing: border-box;
            margin: 0 auto;
        }

        /* Top HUD Header */
        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-bright);
            padding: 8px 4px;
            margin-bottom: 12px;
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: var(--primary-dim);
        }

        .hud-status {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            text-shadow: 0 0 5px var(--glow);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--power-led);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--power-led);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .cyber-panel {
            border: 1px solid var(--border-bright);
            background: var(--panel-bg);
            backdrop-filter: blur(14px) saturate(200%);
            -webkit-backdrop-filter: blur(14px) saturate(200%);
            padding: 1.2rem;
            position: relative;
            margin-bottom: 1rem;
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.35), inset 0 -1px 2px rgba(0, 240, 255, 0.2);
            transition: all 0.3s ease;
        }

        /* Reference Image Styling Customizations */
        body.theme-purple .cyber-panel {
            background: rgba(30, 58, 138, 0.88); /* Deep Cobalt Blue Container from Image */
            border: 3px solid #f4d3ee;             /* Smooth Pastel Pink Bezel Frame */
            clip-path: none;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.35), 0 0 15px rgba(244, 211, 238, 0.4);
            color: #ffffff;
        }

        body.theme-purple .panel-header {
            background: #f4d3ee;                   /* Pastel Pink Bezel Header Bar */
            color: #1e3a8a;                        /* Deep Cobalt Blue Text */
            padding: 8px 12px;
            margin: -1.2rem -1.2rem 1rem -1.2rem;
            border-bottom: 2px solid #ec4899;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: none;
        }

        /* Hot Pink 3D Tactile Buttons (#EC4899) from Reference Image */
        body.theme-purple .terminal-button {
            background: linear-gradient(180deg, #f472b6 0%, #ec4899 100%);
            color: #ffffff;
            border: 2px solid #f4d3ee;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 2px 2px rgba(255,255,255,0.5);
            border-radius: 8px;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }

        body.theme-purple .terminal-button:hover, body.theme-purple .terminal-button:active {
            background: #db2777;
            color: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        body.theme-purple .input-group, body.theme-purple .quote-box, body.theme-purple .split-chip {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid #f4d3ee;
            color: #ffffff;
        }

        body.theme-purple .split-chip.selected {
            background: #ec4899;
            border-color: #f4d3ee;
            color: #ffffff;
        }

        body.theme-purple .item-row {
            border-bottom-color: rgba(244, 211, 238, 0.3);
        }

        body.theme-purple .item-kcal {
            color: #f472b6;
            text-shadow: 0 0 8px rgba(244, 114, 182, 0.6);
        }

        /* 80s Beige Specific Bevel Panel Customizations */
        body.theme-beige .cyber-panel {
            background: #E2DDD5;
            border: 2px solid #1A1A1A;
            box-shadow: inset 2px 2px 0px #FFFFFF, inset -2px -2px 0px #7A756E, 4px 4px 0px 0px #1A1A1A;
            clip-path: none;
            border-radius: 2px;
            backdrop-filter: none;
            color: #1A1A1A;
        }

        body.theme-beige .panel-header {
            background: #0044AA;
            color: #FFFFFF;
            padding: 6px 10px;
            margin: -1.2rem -1.2rem 1rem -1.2rem;
            border-bottom: 2px solid #1A1A1A;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: none;
        }

        body.theme-beige .terminal-button {
            background: #E2DDD5;
            color: #1A1A1A;
            border: 2px solid #1A1A1A;
            box-shadow: inset 1px 1px 0px #FFFFFF, inset -1px -1px 0px #7A756E, 2px 2px 0px 0px #1A1A1A;
            font-weight: bold;
        }

        body.theme-beige .terminal-button:hover, body.theme-beige .terminal-button:active {
            background: #00A36C;
            color: #FFFFFF;
            box-shadow: inset -1px -1px 0px #FFFFFF, inset 1px 1px 0px #1A1A1A;
        }

        body.theme-beige .input-group, body.theme-beige .quote-box, body.theme-beige .split-chip {
            background: #E2DDD5;
            border: 2px solid #1A1A1A;
            box-shadow: inset 1px 1px 0px #FFFFFF, inset -1px -1px 0px #7A756E;
        }

        body.theme-beige .split-chip.selected {
            background: #00A36C;
            color: #FFFFFF;
        }

        body.theme-beige .top-hud, body.theme-beige .bottom-dock {
            background: #B5B0A7;
            border-color: #1A1A1A;
        }

        body.theme-beige .item-row {
            border-bottom-color: #7A756E;
        }

        body.theme-beige .item-kcal {
            color: #0044AA;
            text-shadow: none;
        }

        .cyber-panel::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--border-bright);
        }

        .panel-header {
            font-size: 0.68rem;
            color: var(--primary);
            margin-bottom: 1rem;
            letter-spacing: 1.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 6px;
            text-shadow: 0 0 4px var(--glow);
        }

        .hardware-inputs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 1.2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            padding: 6px 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
        }

        .input-group:hover, .input-group:active {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--glow);
        }

        .input-group label {
            font-size: 0.52rem;
            color: var(--primary-dim);
            margin-bottom: 3px;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .input-group .input-value {
            background: transparent;
            border: none;
            color: var(--primary);
            font-family: var(--font);
            font-size: 0.95rem;
            text-align: center;
            text-shadow: 0 0 5px var(--glow);
            font-weight: bold;
            outline: none;
        }

        .goal-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 1.2rem;
        }

        .goal-selector button {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-bright);
            color: var(--primary-dim);
            font-family: var(--font);
            font-size: 0.65rem;
            padding: 8px 2px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .goal-selector button.active {
            background: var(--primary);
            color: var(--bg);
            font-weight: bold;
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--glow-strong);
        }

        .slider-control { margin-bottom: 1.2rem; }
        .slider-header { display: flex; justify-content: space-between; font-size: 0.68rem; margin-bottom: 8px; }
        .delta-readout { color: #fff; text-shadow: 0 0 6px var(--glow-strong); font-weight: bold; }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: var(--border);
            height: 4px;
            outline: none;
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 22px;
            background: var(--primary);
            border: 1px solid var(--bg);
            cursor: pointer;
            box-shadow: 0 0 10px var(--primary);
            clip-path: polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%);
        }

        /* Macro Spectrum Telemetry */
        .macro-telemetry {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 1rem;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
        }

        .macro-item {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-bright);
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .macro-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.58rem;
            color: var(--primary);
            font-weight: bold;
        }

        .macro-bar {
            height: 6px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border);
            width: 100%;
            overflow: hidden;
            border-radius: 2px;
            position: relative;
        }

        .macro-fill {
            height: 100%;
            background: var(--primary) !important;
            box-shadow: 0 0 8px var(--glow);
            transition: width 0.3s ease;
        }

        .progress-container { margin-top: 1rem; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.65rem; margin-bottom: 6px; }
        .led-bar { display: flex; gap: 3px; height: 12px; }

        /* LED Meter Blocks - Bright Green / Cyan Active Fill */
        .led-block {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .led-block.active {
            background: var(--primary) !important;
            box-shadow: 0 0 8px var(--glow-strong) !important;
            border-color: var(--primary);
        }

        .led-block.active.over-limit {
            background: var(--alert) !important;
            box-shadow: 0 0 8px var(--alert) !important;
            border-color: var(--alert);
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border);
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-kcal {
            color: var(--primary);
            text-shadow: 0 0 5px var(--glow);
            font-weight: bold;
        }

        .item-delete {
            color: var(--alert);
            font-size: 0.65rem;
            cursor: pointer;
            margin-left: 10px;
            border: 1px solid var(--alert);
            padding: 1px 5px;
            transition: all 0.2s ease;
        }

        .item-delete:hover, .item-delete:active {
            background: var(--alert);
            color: #000;
        }

        .no-data {
            font-size: 0.68rem;
            color: var(--primary-dim);
            font-style: italic;
            padding: 8px 0;
            letter-spacing: 0.5px;
        }

        .unit-actions {
            margin-top: 8px;
            display: flex;
            justify-content: flex-end;
        }

        .terminal-button {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--primary);
            color: var(--primary);
            font-family: var(--font);
            font-size: 0.72rem;
            padding: 6px 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .terminal-button:hover, .terminal-button:active {
            background: var(--primary);
            color: var(--bg);
            box-shadow: 0 0 10px var(--glow-strong);
        }

        .pulse-glow { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 5px var(--glow); opacity: 0.8; } 50% { box-shadow: 0 0 18px var(--glow-strong); opacity: 1; } 100% { box-shadow: 0 0 5px var(--glow); opacity: 0.8; } }

        /* Bonfire & Protocol Hero Styling */
        .bonfire-container {
            width: 100%;
            height: 160px;
            background: #000;
            border: 1px solid var(--border-bright);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .bonfire-gif {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .bonfire-art {
            font-size: 2.2rem;
            text-shadow: 0 0 15px var(--warning);
            animation: flame-flicker 1.2s infinite alternate;
        }

        @keyframes flame-flicker {
            0% { transform: scale(1); opacity: 0.85; filter: drop-shadow(0 0 8px #ffaa00); }
            100% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 18px #ff3344); }
        }

        .quote-box {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--primary);
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quote-box:active {
            box-shadow: 0 0 12px var(--glow-strong);
        }

        /* 7-Day Split Strip */
        .split-strip {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 10px;
        }

        .split-chip {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border);
            padding: 8px 2px;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .split-chip.today {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--glow);
        }

        .split-chip.selected {
            background: rgba(0, 255, 102, 0.15);
            border-color: var(--primary);
        }

        .split-chip .day-lbl {
            font-size: 0.68rem;
            font-weight: bold;
            color: #fff;
        }

        .split-chip .tag-lbl {
            font-size: 0.48rem;
            color: var(--primary-dim);
            margin-top: 2px;
        }

        .split-chip.today .tag-lbl {
            color: var(--primary);
        }

        .bottom-dock {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(6, 7, 8, 0.94);
            border-top: 1px solid var(--border-bright);
            padding: 0.8rem 0.4rem;
            display: flex;
            justify-content: space-around;
            align-items: center;
            backdrop-filter: blur(14px);
            z-index: 50;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8);
        }

        .privacy-badge {
            font-size: 0.48rem;
            color: var(--primary-dim);
            position: absolute;
            top: 3px; right: 12px;
            letter-spacing: 0.5px;
        }

        .terminal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 1.5rem;
            backdrop-filter: blur(8px);
        }

        .terminal-dialog {
            width: 100%;
            max-width: 450px;
            background: var(--bg);
            border: 1px solid var(--primary);
            padding: 1.8rem;
            box-shadow: 0 0 35px var(--glow);
            position: relative;
        }

        .prompt { font-size: 0.82rem; margin-bottom: 1rem; letter-spacing: 1px; }
        .cursor { animation: blink 1s steps(2, start) infinite; }
        @keyframes blink { to { visibility: hidden; } }

        .terminal-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--primary);
            color: var(--primary);
            font-family: var(--font);
            font-size: 1.05rem;
            outline: none;
            padding: 8px 0;
            box-sizing: border-box;
            letter-spacing: 1px;
        }

        .dialog-actions {
            margin-top: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Small Theme Trigger on Bottom Left of Activity Page */
        .activity-theme-trigger {
            font-size: 0.62rem;
            color: var(--primary);
            cursor: pointer;
            border: 1px solid var(--border-bright);
            padding: 4px 8px;
            background: rgba(0,0,0,0.4);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .activity-theme-trigger:hover, .activity-theme-trigger:active {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--glow);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        console.log("CYBER_SYSTEM: INITIALIZING...");
        const { useState, useEffect } = React;

        const CyberPanel = ({ title, unit, children }) => (
            <div className="cyber-panel">
                <div className="panel-header">{unit} // {title.toUpperCase()}</div>
                {children}
            </div>
        );

        const TerminalButton = ({ label, onClick, variant = 'primary', pulsing = false, disabled = false }) => (
            <button
                onClick={onClick}
                disabled={disabled}
                className={`terminal-button ${pulsing ? 'pulse-glow' : ''} ${variant}`}
                style={{ opacity: disabled ? 0.5 : 1, cursor: disabled ? 'not-allowed' : 'pointer' }}>
                {label}
            </button>
        );

        const ProgressBar = ({ current, target, label = "CONSUMPTION_METER" }) => {
            const blocks = 20;
            const percentage = target > 0 ? (current / target) : 0;
            const filledBlocks = Math.min(blocks, Math.floor(percentage * blocks));
            const isOver = current > target;

            return (
                <div className="progress-container">
                    <div className="progress-label">
                        <span>{label}</span>
                        <span style={{ color: isOver ? 'var(--alert)' : 'var(--primary)' }}>
                            {current} / {target} KCAL {isOver ? '[OVERLIMIT]' : ''}
                        </span>
                    </div>
                    <div className="led-bar">

                const val = inputValue.toUpperCase().trim();
                if (!val) {

                if (dialogMode === 'METRIC_WGT') {
                    setStats(prev => ({ ...prev, weight: val }));

                    setStats(prev => ({ ...prev, height: val }));

                    setStats(prev => ({ ...prev, age: val }));
                } else if (dialogMode === 'METRIC_GEN') {
                    setStats(prev => ({ ...prev, gender: val }));
                } else if (dialogMode === 'FOOD') {
                    processFoodLog(val, activeUnitId || 'UNIT_01');
                } else if (dialogMode === 'ACTIVITY') {
                    processActivityLog(val);
                }

                setDialogMode(null);
                setInputValue('');
            };

            const processFoodLog = (input, unitId) => {
                const parts = input.split(/ AND | WITH |\+| , |,/);
                let totalKcal = 0;
                let itemNames = [];

                parts.forEach(part => {
                    const p = part.trim();
                    if (!p) return;

                    const weightMatch = p.match(/(\d+)\s*(G|GRAMS|ML|PCS|PC|PIECE|SLICE|SLICES)/);
                    const countMatch = p.match(/^(\d+)\s+/);

                    let foundFood = null;
                    let foodKey = null;

                    const sortedFoods = Object.keys(FOOD_DB).sort((a, b) => b.length - a.length);

                    for (const food of sortedFoods) {
                        if (p.includes(food)) {
                            foundFood = FOOD_DB[food];
                            foodKey = food;
                            break;
                        }
                    }

                    let finalKcal = 0;
                    let displayName = "";

                    if (foundFood) {
                        let quantity = 1;
                        if (weightMatch) {
                            quantity = parseInt(weightMatch[1]);
                            if (foundFood.unit === 'G' || foundFood.unit === 'ML') {
                                finalKcal = Math.floor((foundFood.kcal * quantity) / 100);
                                displayName = `${quantity}${foundFood.unit} ${foodKey}`;
                            } else {
                                finalKcal = foundFood.kcal * quantity;
                                displayName = `${quantity} ${foodKey}`;
                            }
                        } else if (countMatch) {
                            quantity = parseInt(countMatch[1]);
                            finalKcal = (foundFood.unit === 'G' || foundFood.unit === 'ML')
                                ? Math.floor((foundFood.kcal * foundFood.std * quantity) / 100)
                                : foundFood.kcal * quantity;
                            displayName = `${quantity} ${foodKey}`;
                        } else {
                            finalKcal = (foundFood.unit === 'G' || foundFood.unit === 'ML')
                                ? Math.floor((foundFood.kcal * foundFood.std) / 100)
                                : foundFood.kcal;
                            displayName = `1 ${foodKey}`;
                        }
                    } else {
                        const quantity = weightMatch ? parseInt(weightMatch[1]) : 100;
                        finalKcal = Math.floor((150 * quantity) / 100);
                        displayName = `${quantity}G ${p}`;
                    }

                    totalKcal += finalKcal;
                    itemNames.push(displayName);
                });

                const parsedItem = {
                    name: itemNames.join(" + "),
                    kcal: totalKcal
                };

                setIntakeUnits(prev => prev.map(unit =>
                    unit.id === unitId
                    ? { ...unit, items: [...unit.items, parsedItem] }
                    : unit
                ));

                setConsumed(prev => prev + totalKcal);
            };

            const processActivityLog = (input) => {
                const hrMatch = input.match(/(\d+)\s*(HR|HRS|HOUR|HOURS|H)/);
                const minMatch = input.match(/(\d+)\s*(MIN|MINS|M)/);

                let durationHrs = 1;
                if (hrMatch) durationHrs = parseFloat(hrMatch[1]);
                else if (minMatch) durationHrs = parseFloat(minMatch[1]) / 60;

                let foundAct = "GENERAL_ACTIVITY";
                let kcalPerHr = 300;

                const sortedActs = Object.keys(ACTIVITY_DB).sort((a, b) => b.length - a.length);

                for (const act of sortedActs) {
                    if (input.includes(act)) {
                        foundAct = act;
                        kcalPerHr = ACTIVITY_DB[act];
                        break;
                    }
                }

                if (input.includes('HARD') || input.includes('INTENSE')) {
                    kcalPerHr *= 1.3;
                }

                const totalBurned = Math.floor(kcalPerHr * durationHrs);
                const activityEntry = {
                    name: `${durationHrs.toFixed(1)}H ${foundAct}`,
                    kcal: totalBurned
                };

                setActivities(prev => [...prev, activityEntry]);
                setBurned(prev => prev + totalBurned);
            };

            const netCalories = consumed - burned - protocolBurnOffset;
            const proteinEst = Math.floor((consumed * 0.3) / 4);
            const carbsEst = Math.floor((consumed * 0.5) / 4);
            const fatEst = Math.floor((consumed * 0.2) / 9);

            const dayNames = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
            const activeSplit = weeklySplits[selectedDayIdx];
            const activeRoutine = ROUTINES[activeSplit] || [];
            const currentQuote = QUOTES[quoteIdx];

            return (
                <div className="app-container">
                    {/* Top HUD Telemetry Bar */}
                    <div className="top-hud">
                        <div className="hud-status">
                            <div className="status-dot"></div>
                            <span>CALORIENGINE // {currentPage}</span>
                        </div>
                        <div>SYS_VER: 2.5.0 // {theme === 'PURPLE' ? 'ATOMIC_GLASS' : theme === 'BEIGE' ? '80S_BEIGE' : 'PHOSPHOR'}</div>
                    </div>

                    {currentPage === 'PROTOCOL' ? (
                        <>
                            {/* A. Hero Header & NPC Dialogue Box */}
                            <CyberPanel title="CYBERPUNK_BONFIRE // RECOVERY_NODE" unit="HUB_01">
                                <div className="bonfire-container">
                                    {!imageError ? (
                                        <img
                                            src="cyberpunk_bonfire.gif"
                                            alt="Cyberpunk Bonfire"
                                            className="bonfire-gif"
                                            onError={() => setImageError(true)}
                                        />
                                    ) : (
                                        <div className="bonfire-art">🔥⚔️</div>
                                    )}
                                    <div style={{ position: 'absolute', bottom: '6px', left: '8px', fontSize: '0.55rem', color: 'var(--primary-dim)', background: 'rgba(0,0,0,0.7)', padding: '2px 6px', border: '1px solid var(--border)' }}>
                                        OPERATIVE_RESTING // BONFIRE_ACTIVE
                                    </div>
                                </div>
                                <div className="quote-box" onClick={cycleQuote}>
                                    <div style={{ fontSize: '0.55rem', color: 'var(--primary-dim)', marginBottom: '6px' }}>&gt; TACTICAL_TRANSMISSION // LEGEND_LOG</div>
                                    <div style={{ fontSize: '0.75rem', color: 'var(--primary)', lineHeight: '1.4', fontWeight: 'bold' }}>
                                        "{currentQuote.text}"
                                    </div>
                                    <div style={{ fontSize: '0.62rem', color: '#fff', marginTop: '6px', textShadow: '0 0 5px var(--glow)' }}>
                                        — {currentQuote.author}
                                    </div>
                                    <div style={{ textAlign: 'right', fontSize: '0.5rem', color: 'var(--warning)', marginTop: '8px' }}>
                                        [ TAP TO CYCLE TRANSMISSION ]
                                    </div>
                                </div>
                            </CyberPanel>

                            {/* B. 7-Day Split Selector Strip */}
                            <CyberPanel title="7-DAY SPLIT ASSIGNMENT // SELECT DAY" unit="SPLIT_02">
                                <div className="split-strip">
                                    {dayNames.map((day, idx) => {
                                        const isToday = idx === todayIdx;
                                        const isSelected = idx === selectedDayIdx;
                                        const splitTag = weeklySplits[idx];

                                        return (
                                            <div
                                                key={day}
                                                className={`split-chip ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}`}
                                                onClick={() => { setSelectedDayIdx(idx); setSplitPickerDay(idx); }}>
                                                <div className="day-lbl">{day}</div>
                                                <div className="tag-lbl">{splitTag.slice(0, 4)}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </CyberPanel>

                            {/* C. Today's Protocol Dynamic Card */}
                            <CyberPanel title={`TODAY'S PROTOCOL // ${activeSplit}`} unit="ACT_03">
                                {activeSplit === 'REST' ? (
                                    <div style={{ border: '1px solid var(--warning)', padding: '12px', background: 'rgba(0,0,0,0.5)' }}>
                                        <div style={{ color: 'var(--warning)', fontSize: '0.72rem', fontWeight: 'bold', marginBottom: '6px' }}>
                                            [ STATUS: RECOVERY // CELLULAR REPAIR ACTIVE ]
                                        </div>
                                        <div style={{ color: 'var(--primary-dim)', fontSize: '0.62rem', lineHeight: '1.4' }}>
                                            Calorie ceiling locked to baseline maintenance ({target} KCAL). No kinetic expenditure required today. Rebuild.
                                        </div>
                                    </div>
                                ) : (
                                    <div>
                                        <div style={{ fontSize: '0.65rem', color: 'var(--primary-dim)', marginBottom: '10px' }}>ROUTINE CHECKLIST:</div>
                                        {activeRoutine.map(ex => (
                                            <div key={ex.id} className="item-row" onClick={() => toggleExerciseCheck(ex.id)}>
                                                <input type="checkbox" checked={!!checkedExercises[ex.id]} onChange={() => {}} style={{ accentColor: 'var(--primary)' }} />
                                                <span style={{ flex: 1, marginLeft: '8px', fontSize: '0.72rem', color: checkedExercises[ex.id] ? 'var(--primary-dim)' : 'var(--primary)' }}>
                                                    {ex.name} <span style={{ fontSize: '0.58rem', color: 'var(--primary-dim)' }}>({ex.setsReps})</span>
                                                </span>
                                            </div>
                                        ))}
                                        <div style={{ marginTop: '1rem', textAlign: 'right' }}>
                                            <TerminalButton
                                                label={isProtocolExecuted ? "[ PROTOCOL EXECUTED (-300 KCAL) ]" : "[ EXECUTE PROTOCOL / COMPLETE ]"}
                                                onClick={executeProtocol}
                                                disabled={isProtocolExecuted}
                                            />
                                        </div>
                                    </div>
                                )}
                            </CyberPanel>
                        </>
                    ) : currentPage === 'NUTRITION' ? (
                        <>
                            <CyberPanel title="METABOLIC_CORE" unit="SYS_01">
                                <div className="hardware-inputs">
                                    <div className="input-group" onClick={() => setDialogMode('METRIC_WGT')}>
                                        <label>WGT</label>
                                        <div className="input-value">{stats.weight || '70'} KG</div>
                                    </div>
                                    <div className="input-group" onClick={() => setDialogMode('METRIC_HGT')}>
                                        <label>HGT</label>
                                        <div className="input-value">{stats.height || '175'} CM</div>
                                    </div>
                                    <div className="input-group" onClick={() => setDialogMode('METRIC_AGE')}>
                                        <label>AGE</label>
                                        <div className="input-value">{stats.age || '25'} YRS</div>
                                    </div>
                                    <div className="input-group" onClick={() => setDialogMode('METRIC_GEN')}>
                                        <label>GEN</label>
                                        <div className="input-value">{stats.gender || 'M'}</div>
                                    </div>
                                </div>
                                <div className="goal-selector">
                                    {['CUT', 'MAINTAIN', 'BULK'].map(g => (
                                        <button key={g} className={goal === g ? 'active' : ''} onClick={() => handleGoalChange(g)}>[{g}]</button>
                                    ))}
                                </div>
                                <div className="slider-control">
                                    <div className="slider-header"><label>TARGET_CALORIES</label><span className="delta-readout">DELTA: {target-baseCalories > 0 ? '+' : ''}{target-baseCalories} KCAL</span></div>
                                    <input type="range" min="1000" max="4000" value={target} onChange={(e) => setTarget(parseInt(e.target.value))} />
                                </div>
                                <div style={{ display: 'flex', gap: '10px', marginBottom: '10px' }}>
                                    <div style={{ flex: 1 }}><ProgressBar current={Math.max(0, netCalories)} target={target} label="NET_CONSUMPTION" /></div>
                                    <div style={{ width: '85px', border: '1px solid var(--border-bright)', padding: '6px', fontSize: '0.62rem', textAlign: 'center', background: 'rgba(0,0,0,0.4)' }}>
                                        BURNED<br/><span style={{ color: 'var(--warning)', fontWeight: 'bold' }}>{burned + protocolBurnOffset} KCAL</span>
                                    </div>
                                </div>

                                <div className="macro-telemetry">
                                    <div className="macro-item"><div className="macro-header"><span>PROTEIN</span><span>{proteinEst}G</span></div><div className="macro-bar"><div className="macro-fill" style={{ width: `${Math.min(100, (proteinEst / 140) * 100)}%` }}></div></div></div>
                                    <div className="macro-item"><div className="macro-header"><span>CARBS</span><span>{carbsEst}G</span></div><div className="macro-bar"><div className="macro-fill" style={{ width: `${Math.min(100, (carbsEst / 220) * 100)}%` }}></div></div></div>
                                    <div className="macro-item"><div className="macro-header"><span>FATS</span><span>{fatEst}G</span></div><div className="macro-bar"><div className="macro-fill" style={{ width: `${Math.min(100, (fatEst / 60) * 100)}%` }}></div></div></div>
                                </div>

                                {/* Primary Log Intake Action on Core Metabolic Panel */}
                                <div style={{ marginTop: '1rem', textAlign: 'right' }}>
                                    <TerminalButton
                                        label="[ + LOG_INTAKE ]"
                                        onClick={() => {
                                            setActiveUnitId('UNIT_01');
                                            setDialogMode('FOOD');
                                            setInputValue('');
                                        }}
                                    />
                                </div>
                            </CyberPanel>

                            <div className="intake-grid">
                                {intakeUnits.map(unit => {
                                    const unitKcal = unit.items.reduce((sum, item) => sum + item.kcal, 0);
                                    return (
                                        <CyberPanel key={unit.id} title={`${unit.label} [ ${unitKcal} KCAL ]`} unit={unit.id}>
                                            <div className="item-table">
                                                {unit.items.length > 0 ? unit.items.map((item, i) => (
                                                    <div key={i} className="item-row">
                                                        <span style={{ flex: 1 }}>{item.name}</span>
                                                        <span className="item-kcal">{item.kcal} KCAL</span>
                                                        <span className="item-delete" onClick={() => removeItem(unit.id, i)}>X</span>
                                                    </div>
                                                )) : <div className="no-data">STATUS: EMPTY</div>}
                                            </div>
                                            <div className="unit-actions">
                                                <TerminalButton
                                                    label="[ + LOG ]"
                                                    onClick={() => {
                                                        setActiveUnitId(unit.id);
                                                        setDialogMode('FOOD');
                                                        setInputValue('');
                                                    }}
                                                />
                                            </div>
                                        </CyberPanel>
                                    );
                                })}
                            </div>
                        </>
                    ) : (
                        <>
                            <CyberPanel title="KINETIC_OUTPUT" unit="ACT_01">
                                <div style={{ fontSize: '0.7rem', color: 'var(--primary-dim)', marginBottom: '1rem' }}>ENERGY EXPENDITURE LOGGED...</div>
                                <div className="item-table" style={{ minHeight: '100px' }}>
                                    {activities.length > 0 ? activities.map((act, i) => (
                                        <div key={i} className="item-row">
                                            <span style={{ flex: 1 }}>{act.name}</span>
                                            <span style={{ color: '#ffaa00' }}>-{act.kcal} KCAL</span>
                                            <span className="item-delete" onClick={() => removeActivity(i)}>X</span>
                                        </div>
                                    )) : <div className="no-data">STATUS: IDLE</div>}
                                </div>
                                <div className="unit-actions" style={{ marginTop: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                    {/* Small Theme Trigger Icon Below Log Activity on the Bottom Left of Activity Page */}
                                    <div className="activity-theme-trigger" onClick={() => setShowThemeModal(true)}>
                                        ⚙️ THEME
                                    </div>
                                    <TerminalButton
                                        label="[ + LOG_ACTIVITY ]"
                                        onClick={() => {
                                            setDialogMode('ACTIVITY');
                                            setInputValue('');
                                        }}
                                    />
                                </div>
                            </CyberPanel>
                        </>
                    )}

                    {/* Theme Switcher Modal */}
                    {showThemeModal && (
                        <div className="terminal-overlay">
                            <div className="terminal-dialog">
                                <div className="prompt">&gt; SELECT HARDWARE_THEME MATRIX...</div>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', margin: '1.2rem 0' }}>
                                    <button
                                        className="terminal-button"
                                        style={{ border: theme === 'GREEN' ? '2px solid var(--primary)' : '1px solid var(--border)' }}
                                        onClick={() => { toggleTheme('GREEN'); setShowThemeModal(false); }}>
                                        [ PHOSPHOR GREEN // ORIGINAL ]
                                    </button>
                                    <button
                                        className="terminal-button"
                                        style={{ border: theme === 'PURPLE' ? '2px solid var(--primary)' : '1px solid var(--border)', color: '#00f0ff' }}
                                        onClick={() => { toggleTheme('PURPLE'); setShowThemeModal(false); }}>
                                        [ ATOMIC PURPLE GAME BOY &amp; LIQUID GLASS ]
                                    </button>
                                    <button
                                        className="terminal-button"
                                        style={{ border: theme === 'BEIGE' ? '2px solid var(--primary)' : '1px solid var(--border)', background: '#E2DDD5', color: '#1A1A1A' }}
                                        onClick={() => { toggleTheme('BEIGE'); setShowThemeModal(false); }}>
                                        [ 80S BEIGE MACINTOSH // ATARI ST ]
                                    </button>
                                </div>
                                <div className="dialog-actions">
                                    <TerminalButton label="ABORT" onClick={() => setShowThemeModal(false)} />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Split Picker Dialog */}
                    {splitPickerDay !== null && (
                        <div className="terminal-overlay">
                            <div className="terminal-dialog">
                                <div className="prompt">&gt; REASSIGN SPLIT FOR {dayNames[splitPickerDay]}...</div>
                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '8px', margin: '1rem 0' }}>
                                    {['PUSH', 'PULL', 'LEGS', 'UPPER', 'LOWER', 'CARDIO', 'REST', 'CUSTOM'].map(s => (
                                        <button
                                            key={s}
                                            className="terminal-button"
                                            onClick={() => handleUpdateSplit(splitPickerDay, s)}>
                                            [{s}]
                                        </button>
                                    ))}
                                </div>
                                <div className="dialog-actions">
                                    <TerminalButton label="CANCEL" onClick={() => setSplitPickerDay(null)} />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Input Modal Overlay - Abort on Left, Primary Log Action on Right */}
                    {dialogMode !== null && (
                        <div className="terminal-overlay">
                            <div className="terminal-dialog">
                                <div className="prompt">
                                    &gt; {
                                        dialogMode === 'METRIC_WGT' ? 'UPDATE WEIGHT (KG):' :
                                        dialogMode === 'METRIC_HGT' ? 'UPDATE HEIGHT (CM):' :
                                        dialogMode === 'METRIC_AGE' ? 'UPDATE AGE:' :
                                        dialogMode === 'METRIC_GEN' ? 'UPDATE GENDER (M/F):' :
                                        dialogMode === 'ACTIVITY' ? 'ENTER ACTIVITY (E.G. 1HR GYM):' :
                                        'ENTER FOOD INTAKE (E.G. 2 ROTI AND DAL):'
                                    } <span className="cursor">_</span>
                                </div>
                                <input
                                    autoFocus
                                    className="terminal-input"
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    onKeyDown={handleModalSubmit}
                                    placeholder={
                                        dialogMode === 'METRIC_WGT' ? "E.G. 75" :
                                        dialogMode === 'METRIC_HGT' ? "E.G. 180" :
                                        dialogMode === 'METRIC_AGE' ? "E.G. 26" :
                                        dialogMode === 'METRIC_GEN' ? "E.G. M" :
                                        dialogMode === 'ACTIVITY' ? "E.G. 1HR GYM OR 30MIN RUN" :
                                        "E.G. 200G CHICKEN OR 2 ROTI"
                                    }
                                />
                                <div className="dialog-actions">
                                    <TerminalButton label="ABORT" onClick={() => { setDialogMode(null); setInputValue(''); }} />
                                    <TerminalButton
                                        label={
                                            dialogMode === 'ACTIVITY' ? "[ LOG ACTIVITY ]" :
                                            dialogMode.startsWith('METRIC_') ? "[ UPDATE ]" :
                                            "[ LOG INTAKE ]"
                                        }
                                        onClick={submitDialogForm}
                                    />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Original Clean 3-Button Bottom Dock Navigation */}
                    <div className="bottom-dock">
                        <button className="terminal-button" onClick={() => changePage('PROTOCOL')}>
                            {currentPage === 'PROTOCOL' ? '● PROTOCOL' : 'HUB'}
                        </button>
                        <button className="terminal-button" onClick={() => changePage('NUTRITION')}>
                            {currentPage === 'NUTRITION' ? '● CORE' : 'CORE'}
                        </button>
                        <button className="terminal-button" onClick={() => changePage('ACTIVITY')}>
                            {currentPage === 'ACTIVITY' ? '● ACT' : 'ACT >>'}
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
