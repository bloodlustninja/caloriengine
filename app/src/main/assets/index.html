<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CYBER_NUTRITION_TRACKER</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg: #050607;
            --primary: #00ff66;
            --primary-dim: #008837;
            --accent: #c82a74;
            --alert: #ff3344;
            --warning: #ffaa00;
            --border: #132a1e;
            --border-bright: #1b472e;
            --glow: rgba(0, 255, 102, 0.25);
            --glow-strong: rgba(0, 255, 102, 0.6);
            --panel-bg: rgba(4, 14, 8, 0.75);
            --font: 'JetBrains Mono', 'Courier New', monospace;
            --power-led: #00ff66;
        }

        body.theme-purple {
            --bg: #111827;
            --primary: #f472b6;
            --primary-dim: #93c5fd;
            --accent: #ec4899;
            --alert: #f43f5e;
            --warning: #fbbf24;
            --border: rgba(244, 211, 238, 0.5);
            --border-bright: #f4d3ee;
            --glow: rgba(236, 72, 153, 0.4);
            --glow-strong: rgba(244, 114, 182, 0.7);
            --panel-bg: rgba(30, 58, 138, 0.88);
            --power-led: #ec4899;
        }

        body.theme-beige {
            --bg: #B5B0A7;
            --primary: #1A1A1A;
            --primary-dim: #555555;
            --accent: #0044AA;
            --alert: #FF8C00;
            --warning: #00A36C;
            --border: #1A1A1A;
            --border-bright: #0044AA;
            --glow: rgba(0, 68, 170, 0.25);
            --glow-strong: rgba(0, 163, 108, 0.5);
            --panel-bg: #E2DDD5;
            --power-led: #00A36C;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(200, 42, 116, 0.08) 0%, transparent 40%),
                linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            color: var(--primary);
            font-family: var(--font);
            text-transform: uppercase;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        body.theme-purple::after {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1e3a8a;
            background-image:
                radial-gradient(circle at 50% 20%, rgba(244, 211, 238, 0.5) 0%, rgba(232, 184, 222, 0.35) 100%),
                linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px),
                linear-gradient(0deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px),
                radial-gradient(circle at 25% 30%, rgba(37, 99, 235, 0.8) 0%, transparent 35%),
                radial-gradient(circle at 75% 70%, rgba(236, 72, 153, 0.3) 0%, transparent 40%);
            background-size: 100% 100%, 24px 24px, 24px 24px, 100% 100%, 100% 100%;
            z-index: -1;
            pointer-events: none;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.5;
        }

        .app-container {
            padding: 0.8rem;
            padding-top: 38px;
            padding-bottom: 95px;
            max-width: 600px;
            box-sizing: border-box;
            margin: 0 auto;
        }

        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-bright);
            padding: 8px 4px;
            margin-bottom: 12px;
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: var(--primary-dim);
        }

        .hud-status {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            text-shadow: 0 0 5px var(--glow);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--power-led);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--power-led);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .cyber-panel {
            border: 1px solid var(--border-bright);
            background: var(--panel-bg);
            backdrop-filter: blur(14px) saturate(200%);
            -webkit-backdrop-filter: blur(14px) saturate(200%);
            padding: 1.2rem;
            position: relative;
            margin-bottom: 1rem;
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.35), inset 0 -1px 2px rgba(0, 240, 255, 0.2);
            transition: all 0.3s ease;
        }

        body.theme-purple .cyber-panel {
            background: rgba(30, 58, 138, 0.88);
            border: 3px solid #f4d3ee;
            clip-path: none;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.35), 0 0 15px rgba(244, 211, 238, 0.4);
            color: #ffffff;
        }

        body.theme-purple .panel-header {
            background: #f4d3ee;
            color: #1e3a8a;
            padding: 8px 12px;
            margin: -1.2rem -1.2rem 1rem -1.2rem;
            border-bottom: 2px solid #ec4899;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: none;
        }

        body.theme-purple .terminal-button {
            background: linear-gradient(180deg, #f472b6 0%, #ec4899 100%);
            color: #ffffff;
            border: 2px solid #f4d3ee;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 2px 2px rgba(255,255,255,0.5);
            border-radius: 8px;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }

        body.theme-purple .input-group, body.theme-purple .quote-box, body.theme-purple .split-chip {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid #f4d3ee;
            color: #ffffff;
        }

        body.theme-purple .split-chip.selected {
            background: #ec4899;
            border-color: #f4d3ee;
            color: #ffffff;
        }

        body.theme-purple .item-row {
            border-bottom-color: rgba(244, 211, 238, 0.3);
        }

        body.theme-purple .item-kcal {
            color: #f472b6;
            text-shadow: 0 0 8px rgba(244, 114, 182, 0.6);
        }

        body.theme-beige .cyber-panel {
            background: #E2DDD5;
            border: 2px solid #1A1A1A;
            box-shadow: inset 2px 2px 0px #FFFFFF, inset -2px -2px 0px #7A756E, 4px 4px 0px 0px #1A1A1A;
            clip-path: none;
            border-radius: 2px;
            backdrop-filter: none;
            color: #1A1A1A;
        }

        body.theme-beige .panel-header {
            background: #0044AA;
            color: #FFFFFF;
            padding: 6px 10px;
            margin: -1.2rem -1.2rem 1rem -1.2rem;
            border-bottom: 2px solid #1A1A1A;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: none;
        }

        body.theme-beige .terminal-button {
            background: #E2DDD5;
            color: #1A1A1A;
            border: 2px solid #1A1A1A;
            box-shadow: inset 1px 1px 0px #FFFFFF, inset -1px -1px 0px #7A756E, 2px 2px 0px 0px #1A1A1A;
            font-weight: bold;
        }

        body.theme-beige .input-group, body.theme-beige .quote-box, body.theme-beige .split-chip {
            background: #E2DDD5;
            border: 2px solid #1A1A1A;
            box-shadow: inset 1px 1px 0px #FFFFFF, inset -1px -1px 0px #7A756E;
        }

        body.theme-beige .split-chip.selected {
            background: #00A36C;
            color: #FFFFFF;
        }

        body.theme-beige .top-hud, body.theme-beige .bottom-dock {
            background: #B5B0A7;
            border-color: #1A1A1A;
        }

        body.theme-beige .item-row {
            border-bottom-color: #7A756E;
        }

        body.theme-beige .item-kcal {
            color: #0044AA;
            text-shadow: none;
        }

        .cyber-panel::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--border-bright);
        }

        .panel-header {
            font-size: 0.68rem;
            color: var(--primary);
            margin-bottom: 1rem;
            letter-spacing: 1.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 6px;
            text-shadow: 0 0 4px var(--glow);
        }

        .hardware-inputs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 1.2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            padding: 6px 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
        }

        .input-group:hover, .input-group:active {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--glow);
        }

        .input-group label {
            font-size: 0.52rem;
            color: var(--primary-dim);
            margin-bottom: 3px;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .input-group .input-value {
            background: transparent;
            border: none;
            color: var(--primary);
            font-family: var(--font);
            font-size: 0.95rem;
            text-align: center;
            text-shadow: 0 0 5px var(--glow);
            font-weight: bold;
            outline: none;
        }

        .goal-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 1.2rem;
        }

        .goal-selector button {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-bright);
            color: var(--primary-dim);
            font-family: var(--font);
            font-size: 0.65rem;
            padding: 8px 2px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .goal-selector button.active {
            background: var(--primary);
            color: var(--bg);
            font-weight: bold;
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--glow-strong);
        }

        .slider-control { margin-bottom: 1.2rem; }
        .slider-header { display: flex; justify-content: space-between; font-size: 0.68rem; margin-bottom: 8px; }
        .delta-readout { color: #fff; text-shadow: 0 0 6px var(--glow-strong); font-weight: bold; }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: var(--border);
            height: 4px;
            outline: none;
            border-radius: 2px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 22px;
            background: var(--primary);
            border: 1px solid var(--bg);
            cursor: pointer;
            box-shadow: 0 0 10px var(--primary);
            clip-path: polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%);
        }

        .macro-telemetry {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 1rem;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
        }

        .macro-item {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-bright);
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .macro-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.58rem;
            color: var(--primary);
            font-weight: bold;
        }

        .macro-bar {
            height: 6px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border);
            width: 100%;
            overflow: hidden;
            border-radius: 2px;
            position: relative;
        }

        .macro-fill {
            height: 100%;
            background: var(--primary) !important;
            box-shadow: 0 0 8px var(--glow);
            transition: width 0.3s ease;
        }

        .progress-container { margin-top: 1rem; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.65rem; margin-bottom: 6px; }
        .led-bar { display: flex; gap: 3px; height: 12px; }

        .led-block {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .led-block.active {
            background: var(--primary) !important;
            box-shadow: 0 0 8px var(--glow-strong) !important;
            border-color: var(--primary);
        }

        .led-block.active.over-limit {
            background: var(--alert) !important;
            box-shadow: 0 0 8px var(--alert) !important;
            border-color: var(--alert);
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border);
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-kcal {
            color: var(--primary);
            text-shadow: 0 0 5px var(--glow);
            font-weight: bold;
        }

        .item-delete {
            color: var(--alert);
            font-size: 0.65rem;
            cursor: pointer;
            margin-left: 10px;
            border: 1px solid var(--alert);
            padding: 1px 5px;
            transition: all 0.2s ease;
        }

        .item-delete:hover, .item-delete:active {
            background: var(--alert);
            color: #000;
        }

        .no-data {
            font-size: 0.68rem;
            color: var(--primary-dim);
            font-style: italic;
            padding: 8px 0;
            letter-spacing: 0.5px;
        }

        .unit-actions {
            margin-top: 8px;
            display: flex;
            justify-content: flex-end;
        }

        .terminal-button {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--primary);
            color: var(--primary);
            font-family: var(--font);
            font-size: 0.72rem;
            padding: 6px 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .terminal-button:hover, .terminal-button:active {
            background: var(--primary);
            color: var(--bg);
            box-shadow: 0 0 10px var(--glow-strong);
        }

        .pulse-glow { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 5px var(--glow); opacity: 0.8; } 50% { box-shadow: 0 0 18px var(--glow-strong); opacity: 1; } 100% { box-shadow: 0 0 5px var(--glow); opacity: 0.8; } }

        .bonfire-container {
            width: 100%;
            height: 160px;
            background: #000;
            border: 1px solid var(--border-bright);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .bonfire-gif {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .bonfire-art {
            font-size: 2.2rem;
            text-shadow: 0 0 15px var(--warning);
            animation: flame-flicker 1.2s infinite alternate;
        }

        @keyframes flame-flicker {
            0% { transform: scale(1); opacity: 0.85; filter: drop-shadow(0 0 8px #ffaa00); }
            100% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 18px #ff3344); }
        }

        .quote-box {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--primary);
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quote-box:active {
            box-shadow: 0 0 12px var(--glow-strong);
        }

        .split-strip {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 10px;
        }

        .split-chip {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border);
            padding: 8px 2px;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .split-chip.today {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--glow);
        }

        .split-chip.selected {
            background: rgba(0, 255, 102, 0.15);
            border-color: var(--primary);
        }

        .split-chip .day-lbl {
            font-size: 0.68rem;
            font-weight: bold;
            color: #fff;
        }

        .split-chip .tag-lbl {
            font-size: 0.48rem;
            color: var(--primary-dim);
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .split-chip.today .tag-lbl {
            color: var(--primary);
        }

        .bottom-dock {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(6, 7, 8, 0.94);
            border-top: 1px solid var(--border-bright);
            padding: 0.8rem 0.4rem;
            display: flex;
            justify-content: space-around;
            align-items: center;
            backdrop-filter: blur(14px);
            z-index: 50;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8);
        }

        .terminal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 1.5rem;
            backdrop-filter: blur(8px);
        }

        .terminal-dialog {
            width: 100%;
            max-width: 450px;
            background: var(--bg);
            border: 1px solid var(--primary);
            padding: 1.8rem;
            box-shadow: 0 0 35px var(--glow);
            position: relative;
        }

        .prompt { font-size: 0.82rem; margin-bottom: 1rem; letter-spacing: 1px; }
        .cursor { animation: blink 1s steps(2, start) infinite; }
        @keyframes blink { to { visibility: hidden; } }

        .terminal-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--primary);
            color: var(--primary);
            font-family: var(--font);
            font-size: 1.05rem;
            outline: none;
            padding: 8px 0;
            box-sizing: border-box;
            letter-spacing: 1px;
        }

        .dialog-actions {
            margin-top: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .activity-theme-trigger {
            font-size: 0.62rem;
            color: var(--primary);
            cursor: pointer;
            border: 1px solid var(--border-bright);
            padding: 4px 8px;
            background: rgba(0,0,0,0.4);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .activity-theme-trigger:hover, .activity-theme-trigger:active {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--glow);
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        console.log("CYBER_SYSTEM: INITIALIZING...");
        const { useState, useEffect } = React;

        const CyberPanel = ({ title, unit, children }) => (
            <div className="cyber-panel">
                <div className="panel-header">{unit} // {title.toUpperCase()}</div>
                {children}
            </div>
        );

        const TerminalButton = ({ label, onClick, variant = 'primary', pulsing = false, disabled = false }) => (
            <button
                onClick={onClick}
                disabled={disabled}
                className={`terminal-button ${pulsing ? 'pulse-glow' : ''} ${variant}`}
                style={{ opacity: disabled ? 0.5 : 1, cursor: disabled ? 'not-allowed' : 'pointer' }}>
                {label}
            </button>
        );

        const ProgressBar = ({ current, target, label = "CONSUMPTION_METER" }) => {
            const blocks = 20;
            const percentage = target > 0 ? (current / target) : 0;
            const filledBlocks = Math.min(blocks, Math.floor(percentage * blocks));
            const isOver = current > target;

            return (
                <div className="progress-container">
                    <div className="progress-label">
                        <span>{label}</span>
                        <span style={{ color: isOver ? 'var(--alert)' : 'var(--primary)' }}>
                            {current} / {target} KCAL {isOver ? '[OVERLIMIT]' : ''}
                        </span>
                    </div>
                    <div className="led-bar">
                        {Array.from({ length: blocks }).map((_, i) => (
                            <div
                                key={i}
                                className={`led-block ${i < filledBlocks ? 'active' : ''} ${isOver ? 'over-limit' : ''}`}
                            />
                        ))}
                    </div>
                </div>
            );
        };

        const QUOTES = [
            { text: "The resistance that you fight physically in the gym and in life can only build a strong character.", author: "ARNOLD SCHWARZENEGGER" },
            { text: "Everybody wants to be a bodybuilder, but nobody wants to lift no heavy-ass weights!", author: "RONNIE COLEMAN" },
            { text: "Concentration, focus, and relentless intensity. You don't train to fail, you train to succeed.", author: "DORIAN YATES" },
            { text: "Failure is not an option. It is a prerequisite for growth.", author: "TOM PLATZ" },
            { text: "In the midst of chaos, there is also opportunity. Victory belongs to those who prepare.", author: "SUN TZU" },
            { text: "You have power over your mind - not outside events. Realize this, and you will find strength.", author: "MARCUS AURELIUS" },
            { text: "There is nothing outside of yourself that can enable you to get stronger. Everything is within.", author: "MIYAMOTO MUSASHI" },
            { text: "There is nothing impossible to him who will try.", author: "ALEXANDER THE GREAT" },
            { text: "Cowards die many times before their deaths; the valiant taste of death but once.", author: "JULIUS CAESAR" },
            { text: "Victory belongs to the most persevering. Impossible is a word found only in the dictionary of fools.", author: "NAPOLEON BONAPARTE" },

                .replace(/\bFIVE\b/g, '5')
                .replace(/\bSIX\b/g, '6')
                .replace(/\bSEVEN\b/g, '7')
                .replace(/\bEIGHT\b/g, '8')
                .replace(/\bNINE\b/g, '9')
                .replace(/\bTEN\b/g, '10')
                .replace(/\bHALF\b/g, '0.5');
        };

        const getItemMacros = (item) => {
            if (typeof item.p === 'number' && typeof item.c === 'number' && typeof item.f === 'number') {
                return { p: item.p, c: item.c, f: item.f };
            }

            const nameUpper = (item.name || '').toUpperCase();
            let foundFood = null;
            const sortedFoods = Object.keys(FOOD_DB).sort((a, b) => b.length - a.length);

            for (const food of sortedFoods) {
                if (nameUpper.replace(/\s+/g, '').includes(food.replace(/\s+/g, ''))) {
                    foundFood = FOOD_DB[food];
                    break;
                }
            }

            if (foundFood) {
                const factor = (item.kcal || foundFood.kcal) / (foundFood.kcal || 150);
                return {
                    p: (foundFood.p || 0) * factor,
                    c: (foundFood.c || 0) * factor,
                    f: (foundFood.f || 0) * factor
                };
            }

            const ratioKcal = (item.kcal || 150) / 150;
            return {
                p: 3.5 * ratioKcal,
                c: 22.0 * ratioKcal,
                f: 5.0 * ratioKcal
            };
        };

        // Smart Categorical Macro Estimator Fallback Engine
        const estimateCategoryMacros = (query, hasExplicitGramWeight) => {
            const q = query.toUpperCase();

            // Category 1: Poultry & Lean Meats
            if (q.includes('CHICKEN') || q.includes('TURKEY') || q.includes('TANDOORI') || q.includes('TIKKA')) {
                return { kcal: 180, p: 26.0, c: 3.0, f: 7.0, std: 100, pieceGrams: 150, unit: 'G' };
            }
            // Category 2: Red Meats
            if (q.includes('MUTTON') || q.includes('LAMB') || q.includes('BEEF') || q.includes('KEEMA')) {
                return { kcal: 250, p: 22.0, c: 2.0, f: 18.0, std: 100, pieceGrams: 150, unit: 'G' };
            }
            // Category 3: Fish & Seafood
            if (q.includes('FISH') || q.includes('SURMAI') || q.includes('POMFRET') || q.includes('PRAWN') || q.includes('SALMON')) {
                return { kcal: 190, p: 22.0, c: 1.0, f: 11.0, std: 100, pieceGrams: 120, unit: 'G' };
            }
            // Category 4: High-Protein Dairy & Whey
            if (q.includes('WHEY') || q.includes('ISOLATE') || q.includes('PROTEIN') || q.includes('PANEER') || q.includes('CURD') || q.includes('YOGURT')) {
                return { kcal: 240, p: 20.0, c: 10.0, f: 12.0, std: 100, pieceGrams: 50, unit: 'G' };
            }
            // Category 5: Chocolates, Candies, Wafers, Bars
            if (q.includes('BAR') || q.includes('CHOCOLATE') || q.includes('CANDY') || q.includes('WAFER') || q.includes('KIT') || q.includes('MILKY') || q.includes('SNICKER')) {
                return { kcal: 490, p: 8.0, c: 61.0, f: 24.0, std: 100, pieceGrams: 20, unit: 'G' };
            }
            // Category 6: Fast Food, Rolls, Wraps, Burgers
            if (q.includes('ROLL') || q.includes('FRANKIE') || q.includes('WRAP') || q.includes('SHAWARMA') || q.includes('BURGER') || q.includes('PIZZA')) {
                return { kcal: 230, p: 14.0, c: 26.0, f: 9.0, std: 100, pieceGrams: 140, unit: 'G' };
            }
            // Category 7: Cereals, Oats, Rice, Rotis
            if (q.includes('OAT') || q.includes('OATS') || q.includes('MUESLI') || q.includes('ROTI') || q.includes('RICE') || q.includes('BREAD')) {
                return { kcal: 360, p: 12.0, c: 65.0, f: 5.0, std: 100, pieceGrams: 50, unit: 'G' };
            }

            // Universal Default Fallback
            return { kcal: 200, p: 8.0, c: 28.0, f: 6.0, std: 100, pieceGrams: 100, unit: 'G' };
        };

        // Multi-Engine Online Live Nutrition Lookup
        const fetchOnlineNutrition = async (foodQuery, hasExplicitGramWeight) => {
            const cleanQuery = foodQuery.trim();
            if (!cleanQuery) return null;

            try {
                const res = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(cleanQuery)}&search_simple=1&action=process&json=1`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.products && data.products.length > 0) {
                        for (let prod of data.products) {
                            const nutriments = prod.nutriments || {};
                            const kcal100 = nutriments['energy-kcal_100g'] || nutriments['energy-kcal_value'] || (nutriments['energy_100g'] ? nutriments['energy_100g'] / 4.184 : 0);

                            if (kcal100 && kcal100 > 10) {
                                const p100 = nutriments['proteins_100g'] || 8;
                                const c100 = nutriments['carbohydrates_100g'] || 20;
                                const f100 = nutriments['fat_100g'] || 5;

                                const queryUpper = cleanQuery.toUpperCase();
                                const isSnackOrBar = queryUpper.includes('BAR') || queryUpper.includes('CHOCOLATE') || queryUpper.includes('CANDY') || queryUpper.includes('SNACK') || queryUpper.includes('WAFER') || queryUpper.includes('KIT') || queryUpper.includes('MILKY');

                                const pieceGrams = isSnackOrBar ? 20 : 100;

                                return {
                                    kcal: Math.round(kcal100),
                                    p: parseFloat(p100.toFixed(1)),
                                    c: parseFloat(c100.toFixed(1)),
                                    f: parseFloat(f100.toFixed(1)),
                                    std: 100,
                                    pieceGrams: pieceGrams,
                                    unit: 'G'
                                };
                            }
                        }
                    }
                }
            } catch (e) {}

            return null;
        };

        function App() {
            const [stats, setStats] = useState(() => {
                try {
                    const saved = localStorage.getItem('cyber_stats');
                    return saved ? JSON.parse(saved) : { weight: '70', height: '175', age: 25, gender: 'M' };
                } catch (e) { return { weight: '70', height: '175', age: 25, gender: 'M' }; }
            });

            const [theme, setTheme] = useState(() => {
                const saved = localStorage.getItem('cyber_theme') || 'GREEN';
                return (saved === 'ARCADE' || saved === 'SELPHIE') ? 'GREEN' : saved;
            });

            useEffect(() => {
                document.body.classList.remove('theme-purple', 'theme-beige');
                if (theme === 'PURPLE') {
                    document.body.classList.add('theme-purple');
                } else if (theme === 'BEIGE') {
                    document.body.classList.add('theme-beige');
                }
                localStorage.setItem('cyber_theme', theme);
                if (window.AndroidHost && window.AndroidHost.saveTheme) {
                    window.AndroidHost.saveTheme(theme);
                }
            }, [theme]);

            const toggleTheme = (newTheme) => {
                setTheme(newTheme);
            };

            const [currentPage, setCurrentPage] = useState(() => {
                return localStorage.getItem('cyber_current_page') || 'NUTRITION';
            });

            const changePage = (page) => {
                setCurrentPage(page);
                localStorage.setItem('cyber_current_page', page);
            };

            const [goal, setGoal] = useState(() => {
                return localStorage.getItem('cyber_goal') || 'MAINTAIN';
            });

            const calculateBaseCalories = (wStr, hStr, aNum, gStr) => {
                const w = parseFloat(wStr) || 70;
                const h = parseFloat(hStr) || 175;
                const a = parseFloat(aNum) || 25;
                const isMale = (gStr || 'M').toUpperCase().startsWith('M');
                const bmr = (10 * w) + (6.25 * h) - (5 * a) + (isMale ? 5 : -161);
                return Math.round(bmr * 1.375);
            };

            const baseCalories = calculateBaseCalories(stats.weight, stats.height, stats.age, stats.gender);
            const [target, setTarget] = useState(baseCalories);

            useEffect(() => {
                let newTarget = baseCalories;
                if (goal === 'CUT') newTarget = baseCalories - 500;
                else if (goal === 'BULK') newTarget = baseCalories + 500;
                const finalTarget = Math.max(1200, newTarget);
                setTarget(finalTarget);
                localStorage.setItem('cyber_target', finalTarget);
                if (window.AndroidHost && window.AndroidHost.syncTarget) {
                    window.AndroidHost.syncTarget(finalTarget);
                }
            }, [stats.weight, stats.height, stats.age, stats.gender, goal]);

            const [consumed, setConsumed] = useState(0);
            const [burned, setBurned] = useState(0);
            const [protocolBurnOffset, setProtocolBurnOffset] = useState(0);
            const [intakeUnits, setIntakeUnits] = useState([
                { id: 'UNIT_01', label: 'BREAKFAST', items: [] },
                { id: 'UNIT_02', label: 'LUNCH', items: [] },
                { id: 'UNIT_03', label: 'SNACKS', items: [] },
                { id: 'UNIT_04', label: 'DINNER', items: [] },
            ]);
            const [activities, setActivities] = useState([]);
            const [historyLogs, setHistoryLogs] = useState(() => {
                try {
                    const saved = localStorage.getItem('cyber_rolling_history');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });

            const [weeklySplits, setWeeklySplits] = useState(() => {
                const saved = localStorage.getItem('cyber_weekly_split');
                return saved ? JSON.parse(saved) : DEFAULT_SPLITS;
            });

            const todayIdx = (new Date().getDay() + 6) % 7;
            const [selectedDayIdx, setSelectedDayIdx] = useState(todayIdx);
            const [quoteIdx, setQuoteIdx] = useState(0);
            const [splitPickerDay, setSplitPickerDay] = useState(null);
            const [customSplitName, setCustomSplitName] = useState('');
            const [imageError, setImageError] = useState(false);
            const [showThemeModal, setShowThemeModal] = useState(false);
            const [isOnlineFetching, setIsOnlineFetching] = useState(false);

            const [checkedExercises, setCheckedExercises] = useState({});
            const [isProtocolExecuted, setIsProtocolExecuted] = useState(() => {
                const todayStr = new Date().toLocaleDateString();
                return localStorage.getItem(`cyber_protocol_executed_${todayStr}`) === 'true';
            });

            const [dialogMode, setDialogMode] = useState(null);
            const [activeUnitId, setActiveUnitId] = useState(null);
            const [inputValue, setInputValue] = useState('');

            useEffect(() => {
                window.triggerQuickLog = (mealName) => {
                    const unitMap = { 'BREAKFAST': 'UNIT_01', 'LUNCH': 'UNIT_02', 'SNACKS': 'UNIT_03', 'DINNER': 'UNIT_04' };
                    const unitId = unitMap[mealName] || 'UNIT_01';
                    changePage('NUTRITION');
                    setActiveUnitId(unitId);
                    setDialogMode('FOOD');
                    setInputValue('');
                };
            }, []);

            useEffect(() => {
                localStorage.setItem('cyber_weekly_split', JSON.stringify(weeklySplits));
            }, [weeklySplits]);

            useEffect(() => {
                const todayDateStr = new Date().toLocaleDateString();
                const lastSavedDate = localStorage.getItem('cyber_last_date');

                if (lastSavedDate && lastSavedDate !== todayDateStr) {
                    const prevConsumed = parseInt(localStorage.getItem('cyber_consumed') || '0');
                    const prevBurned = parseInt(localStorage.getItem('cyber_burned') || '0');
                    const prevTarget = target;

                    let prevProtein = 0, prevCarbs = 0, prevFats = 0;
                    try {
                        const savedUnits = JSON.parse(localStorage.getItem('cyber_units') || '[]');
                        savedUnits.forEach(u => {
                            (u.items || []).forEach(it => {
                                const m = getItemMacros(it);
                                prevProtein += m.p;
                                prevCarbs += m.c;
                                prevFats += m.f;
                            });
                        });
                    } catch(e) {}

                    const yesterdayLog = {
                        date: lastSavedDate,
                        consumed: prevConsumed,
                        target: prevTarget,
                        burned: prevBurned,
                        protein: Math.round(prevProtein),
                        carbs: Math.round(prevCarbs),
                        fats: Math.round(prevFats)
                    };

                    const existingLogs = JSON.parse(localStorage.getItem('cyber_rolling_history') || '[]');
                    const updatedLogs = [yesterdayLog, ...existingLogs].slice(0, 2);

                    localStorage.setItem('cyber_rolling_history', JSON.stringify(updatedLogs));
                    setHistoryLogs(updatedLogs);

                    localStorage.setItem('cyber_last_date', todayDateStr);
                    localStorage.setItem('cyber_consumed', '0');
                    localStorage.setItem('cyber_burned', '0');
                    localStorage.setItem('cyber_activities', '[]');
                    const cleanUnits = [
                        { id: 'UNIT_01', label: 'BREAKFAST', items: [] },
                        { id: 'UNIT_02', label: 'LUNCH', items: [] },
                        { id: 'UNIT_03', label: 'SNACKS', items: [] },
                        { id: 'UNIT_04', label: 'DINNER', items: [] },
                    ];
                    localStorage.setItem('cyber_units', JSON.stringify(cleanUnits));

                    setConsumed(0);
                    setBurned(0);
                    setActivities([]);
                    setIntakeUnits(cleanUnits);
                    setIsProtocolExecuted(false);
                } else {
                    setConsumed(parseInt(localStorage.getItem('cyber_consumed') || '0'));
                    setBurned(parseInt(localStorage.getItem('cyber_burned') || '0'));
                    const savedUnits = localStorage.getItem('cyber_units');
                    if (savedUnits) setIntakeUnits(JSON.parse(savedUnits));
                    const savedActs = localStorage.getItem('cyber_activities');
                    if (savedActs) setActivities(JSON.parse(savedActs));
                    const savedHist = localStorage.getItem('cyber_rolling_history');
                    if (savedHist) setHistoryLogs(JSON.parse(savedHist));

                    if (localStorage.getItem(`cyber_protocol_executed_${todayDateStr}`) === 'true') {
                        setIsProtocolExecuted(true);
                        setProtocolBurnOffset(300);
                    }
                }
            }, []);

            useEffect(() => {
                const todayDateStr = new Date().toLocaleDateString();
                localStorage.setItem('cyber_last_date', todayDateStr);
                localStorage.setItem('cyber_consumed', consumed);
                localStorage.setItem('cyber_burned', burned);
                localStorage.setItem('cyber_units', JSON.stringify(intakeUnits));
                localStorage.setItem('cyber_activities', JSON.stringify(activities));
                localStorage.setItem('cyber_stats', JSON.stringify(stats));
                localStorage.setItem('cyber_goal', goal);
                localStorage.setItem('cyber_target', target);

                if (window.AndroidHost && window.AndroidHost.syncStorage) {
                    window.AndroidHost.syncStorage(consumed, JSON.stringify(intakeUnits));
                }
                if (window.AndroidHost && window.AndroidHost.syncTarget) {
                    window.AndroidHost.syncTarget(target);
                }
            }, [consumed, burned, intakeUnits, activities, stats, goal, target]);

            const cycleQuote = () => {
                setQuoteIdx(prev => (prev + 1) % QUOTES.length);
            };

            const toggleExerciseCheck = (exId) => {
                setCheckedExercises(prev => ({ ...prev, [exId]: !prev[exId] }));
            };

            const executeProtocol = () => {
                const todayStr = new Date().toLocaleDateString();
                setIsProtocolExecuted(true);
                setProtocolBurnOffset(300);
                localStorage.setItem(`cyber_protocol_executed_${todayStr}`, 'true');
            };

            const handleUpdateSplit = (dayIdx, newSplit) => {
                setWeeklySplits(prev => {
                    const updated = [...prev];
                    updated[dayIdx] = newSplit;
                    return updated;
                });
                setSplitPickerDay(null);
                setCustomSplitName('');
            };

            const handleGoalChange = (newGoal) => {
                setGoal(newGoal);
                localStorage.setItem('cyber_goal', newGoal);
                if (window.AndroidHost && window.AndroidHost.saveGoal) {
                    window.AndroidHost.saveGoal(newGoal);
                }
            };

            const removeItem = (unitId, itemIdx) => {
                setIntakeUnits(prev => prev.map(unit => {
                    if (unit.id === unitId) {
                        const item = unit.items[itemIdx];
                        setConsumed(c => Math.max(0, c - item.kcal));
                        return { ...unit, items: unit.items.filter((_, idx) => idx !== itemIdx) };
                    }
                    return unit;
                }));
            };

            const removeActivity = (actIdx) => {
                setActivities(prev => {
                    const item = prev[actIdx];
                    setBurned(b => Math.max(0, b - item.kcal));
                    return prev.filter((_, idx) => idx !== actIdx);
                });
            };

            const handleModalSubmit = (e) => {
                if (e.key === 'Enter') {
                    submitDialogForm();
                }
            };

            const submitDialogForm = async () => {
                const val = inputValue.toUpperCase().trim();
                if (!val) {
                    setDialogMode(null);
                    setInputValue('');
                    return;
                }

                if (dialogMode === 'METRIC_WGT') {
                    setStats(prev => ({ ...prev, weight: val }));
                    setDialogMode(null);
                } else if (dialogMode === 'METRIC_HGT') {
                    setStats(prev => ({ ...prev, height: val }));
                    setDialogMode(null);
                } else if (dialogMode === 'METRIC_AGE') {
                    setStats(prev => ({ ...prev, age: val }));
                    setDialogMode(null);
                } else if (dialogMode === 'METRIC_GEN') {
                    setStats(prev => ({ ...prev, gender: val }));
                    setDialogMode(null);
                } else if (dialogMode === 'FOOD') {
                    setIsOnlineFetching(true);
                    await processFoodLog(val, activeUnitId || 'UNIT_01');
                    setIsOnlineFetching(false);
                    setDialogMode(null);
                } else if (dialogMode === 'ACTIVITY') {
                    processActivityLog(val);
                    setDialogMode(null);
                }

                setInputValue('');
            };

            // Precision Food Quantity, Weight & Smart Category Parser
            const processFoodLog = async (input, unitId) => {
                const parts = input.split(/ AND | WITH |\+| , |,/);
                let totalKcal = 0;
                let itemNames = [];
                let itemProtein = 0, itemCarbs = 0, itemFats = 0;

                for (let part of parts) {
                    const p = parseWordToNumber(part.trim().toUpperCase());
                    if (!p) continue;

                    const weightMatch = p.match(/^(\d+(?:\.\d+)?)\s*(G|GRAMS|ML)\b/i);
                    const countMatch = p.match(/^(\d+(?:\.\d+)?)\s*(PCS|PC|PIECE|PIECES|SLICE|SLICES)?\b/i);

                    let totalWeightGrams = null;
                    let pieceCount = 1;
                    let hasExplicitGramWeight = false;

                    if (weightMatch) {
                        totalWeightGrams = parseFloat(weightMatch[1]);
                        hasExplicitGramWeight = true;
                    } else if (countMatch) {
                        pieceCount = parseFloat(countMatch[1]);
                    }

                    const rawQuery = p
                        .replace(/^(\d+(?:\.\d+)?)\s*(G|GRAMS|ML|PCS|PC|PIECE|PIECES|SLICE|SLICES)?\s*/i, '')
                        .trim();

                    let foundFood = null;
                    let foodKey = null;

                    // 1. Exact Full Query Local DB Match
                    if (FOOD_DB[rawQuery]) {
                        foundFood = FOOD_DB[rawQuery];
                        foodKey = rawQuery;
                    }

                    // 2. Exact Word Boundary Local DB Check
                    if (!foundFood) {
                        const sortedFoods = Object.keys(FOOD_DB).sort((a, b) => b.length - a.length);
                        for (const food of sortedFoods) {
                            const wordRegex = new RegExp('\\b' + food.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
                            if (wordRegex.test(rawQuery)) {
                                foundFood = FOOD_DB[food];
                                foodKey = food;
                                break;
                            }
                        }
                    }

                    // 3. Online Search Fallback
                    if (!foundFood && rawQuery.length > 2) {
                        const onlineNutr = await fetchOnlineNutrition(rawQuery, hasExplicitGramWeight);
                        if (onlineNutr) {
                            foundFood = onlineNutr;
                            foodKey = rawQuery;
                            FOOD_DB[foodKey] = onlineNutr;
                        }
                    }

                    // 4. Smart Categorical Fallback Engine (Guarantees realistic Macros for ANY dish)
                    if (!foundFood) {
                        foundFood = estimateCategoryMacros(rawQuery, hasExplicitGramWeight);
                        foodKey = rawQuery;
                    }

                    let finalKcal = 0;
                    let displayName = "";
                    let calcP = 0, calcC = 0, calcF = 0;

                    const baseStd = foundFood.std || 100;
                    const pieceGrams = foundFood.pieceGrams || 100;

                    let calculatedWeightGrams = 100;
                    if (hasExplicitGramWeight && totalWeightGrams !== null) {
                        calculatedWeightGrams = totalWeightGrams;
                        displayName = `${totalWeightGrams}G ${foodKey}`;
                    } else {
                        calculatedWeightGrams = pieceCount * pieceGrams;
                        displayName = pieceCount > 1 ? `${pieceCount}x ${foodKey}` : `${foodKey}`;
                    }

                    const factor = calculatedWeightGrams / baseStd;
                    finalKcal = Math.floor(foundFood.kcal * factor);
                    calcP = (foundFood.p || 0) * factor;
                    calcC = (foundFood.c || 0) * factor;
                    calcF = (foundFood.f || 0) * factor;

                    totalKcal += finalKcal;
                    itemProtein += calcP;
                    itemCarbs += calcC;
                    itemFats += calcF;
                    itemNames.push(displayName);
                }

                const parsedItem = {
                    name: itemNames.join(" + "),
                    kcal: totalKcal,
                    p: parseFloat(itemProtein.toFixed(1)),
                    c: parseFloat(itemCarbs.toFixed(1)),
                    f: parseFloat(itemFats.toFixed(1))
                };

                setIntakeUnits(prev => prev.map(unit =>
                    unit.id === unitId
                    ? { ...unit, items: [...unit.items, parsedItem] }
                    : unit
                ));

                setConsumed(prev => prev + totalKcal);
            };

            const processActivityLog = (input) => {
                const hrMatch = input.match(/(\d+)\s*(HR|HRS|HOUR|HOURS|H)/);
                const minMatch = input.match(/(\d+)\s*(MIN|MINS|M)/);

                let durationHrs = 1;
                if (hrMatch) durationHrs = parseFloat(hrMatch[1]);
                else if (minMatch) durationHrs = parseFloat(minMatch[1]) / 60;

                let foundAct = "GENERAL_ACTIVITY";
                let kcalPerHr = 300;

                const sortedActs = Object.keys(ACTIVITY_DB).sort((a, b) => b.length - a.length);

                for (const act of sortedActs) {
                    if (input.includes(act)) {
                        foundAct = act;
                        kcalPerHr = ACTIVITY_DB[act];
                        break;
                    }
                }

                if (input.includes('HARD') || input.includes('INTENSE')) {
                    kcalPerHr *= 1.3;
                }

                const totalBurned = Math.floor(kcalPerHr * durationHrs);
                const activityEntry = {
                    name: `${durationHrs.toFixed(1)}H ${foundAct}`,
                    kcal: totalBurned
                };

                setActivities(prev => [...prev, activityEntry]);
                setBurned(prev => prev + totalBurned);
            };

            const netCalories = consumed - burned - protocolBurnOffset;

            let proteinEst = 0, carbsEst = 0, fatEst = 0;
            intakeUnits.forEach(unit => {
                (unit.items || []).forEach(item => {
                    const m = getItemMacros(item);
                    proteinEst += m.p;
                    carbsEst += m.c;
                    fatEst += m.f;
                });
            });
            proteinEst = Math.round(proteinEst);
            carbsEst = Math.round(carbsEst);
            fatEst = Math.round(fatEst);

            const dayNames = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
            const activeSplit = weeklySplits[selectedDayIdx];
            const activeRoutine = ROUTINES[activeSplit] || ROUTINES['CUSTOM'];
            const currentQuote = QUOTES[quoteIdx];

            return (
                <div className="app-container">
                    <div className="top-hud">
                        <div className="hud-status">
                            <div className="status-dot"></div>
                            <span>CALORIENGINE // {currentPage}</span>
                        </div>
                        <div>SYS_VER: 2.5.0 // {theme === 'PURPLE' ? 'ATOMIC_GLASS' : theme === 'BEIGE' ? '80S_BEIGE' : 'PHOSPHOR'}</div>
                    </div>

                    {currentPage === 'PROTOCOL' ? (
                        <>
                            <CyberPanel title="CYBERPUNK_BONFIRE // RECOVERY_NODE" unit="HUB_01">
                                <div className="bonfire-container">
                                    {!imageError ? (
                                        <img
                                            src="cyberpunk_bonfire.gif"
                                            alt="Cyberpunk Bonfire"
                                            className="bonfire-gif"
                                            onError={() => setImageError(true)}
                                        />
                                    ) : (
                                        <div className="bonfire-art">🔥⚔️</div>
                                    )}
                                    <div style={{ position: 'absolute', bottom: '6px', left: '8px', fontSize: '0.55rem', color: 'var(--primary-dim)', background: 'rgba(0,0,0,0.7)', padding: '2px 6px', border: '1px solid var(--border)' }}>
                                        OPERATIVE_RESTING // BONFIRE_ACTIVE
                                    </div>
                                </div>
                                <div className="quote-box" onClick={cycleQuote}>
                                    <div style={{ fontSize: '0.55rem', color: 'var(--primary-dim)', marginBottom: '6px' }}>&gt; TACTICAL_TRANSMISSION // LEGEND_LOG</div>
                                    <div style={{ fontSize: '0.75rem', color: 'var(--primary)', lineHeight: '1.4', fontWeight: 'bold' }}>
                                        "{currentQuote.text}"
                                    </div>
                                    <div style={{ fontSize: '0.62rem', color: '#fff', marginTop: '6px', textShadow: '0 0 5px var(--glow)' }}>
                                        — {currentQuote.author}
                                    </div>
                                    <div style={{ textAlign: 'right', fontSize: '0.5rem', color: 'var(--warning)', marginTop: '8px' }}>
                                        [ TAP TO CYCLE TRANSMISSION ]
                                    </div>
                                </div>
                            </CyberPanel>

                            <CyberPanel title="7-DAY SPLIT ASSIGNMENT // SELECT DAY" unit="SPLIT_02">
                                <div className="split-strip">
                                    {dayNames.map((day, idx) => {
                                        const isToday = idx === todayIdx;
                                        const isSelected = idx === selectedDayIdx;
                                        const splitTag = weeklySplits[idx];

                                        return (
                                            <div
                                                key={day}
                                                className={`split-chip ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}`}
                                                onClick={() => { setSelectedDayIdx(idx); setSplitPickerDay(idx); }}>
                                                <div className="day-lbl">{day}</div>
                                                <div className="tag-lbl">{splitTag.slice(0, 5)}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </CyberPanel>

                            <CyberPanel title={`TODAY'S PROTOCOL // ${activeSplit}`} unit="ACT_03">
                                {activeSplit === 'REST' ? (
                                    <div style={{ border: '1px solid var(--warning)', padding: '12px', background: 'rgba(0,0,0,0.5)' }}>
                                        <div style={{ color: 'var(--warning)', fontSize: '0.72rem', fontWeight: 'bold', marginBottom: '6px' }}>
                                            [ STATUS: RECOVERY // CELLULAR REPAIR ACTIVE ]
                                        </div>
                                        <div style={{ color: 'var(--primary-dim)', fontSize: '0.62rem', lineHeight: '1.4' }}>
                                            Calorie ceiling locked to baseline maintenance ({target} KCAL). No kinetic expenditure required today. Rebuild.
                                        </div>
                                    </div>
                                ) : (
                                    <div>
                                        <div style={{ fontSize: '0.65rem', color: 'var(--primary-dim)', marginBottom: '10px' }}>ROUTINE CHECKLIST:</div>
                                        {activeRoutine.map(ex => (
                                            <div key={ex.id} className="item-row" onClick={() => toggleExerciseCheck(ex.id)}>
                                                <input type="checkbox" checked={!!checkedExercises[ex.id]} onChange={() => {}} style={{ accentColor: 'var(--primary)' }} />
                                                <span style={{ flex: 1, marginLeft: '8px', fontSize: '0.72rem', color: checkedExercises[ex.id] ? 'var(--primary-dim)' : 'var(--primary)' }}>
                                                    {ex.name} <span style={{ fontSize: '0.58rem', color: 'var(--primary-dim)' }}>({ex.setsReps})</span>
                                                </span>
                                            </div>
                                        ))}
                                        <div style={{ marginTop: '1rem', textAlign: 'right' }}>
                                            <TerminalButton
                                                label={isProtocolExecuted ? "[ PROTOCOL EXECUTED (-300 KCAL) ]" : "[ EXECUTE PROTOCOL / COMPLETE ]"}
                                                onClick={executeProtocol}
                                                disabled={isProtocolExecuted}
                                            />
                                        </div>
                                    </div>
                                )}
                            </CyberPanel>
                        </>
                    ) : currentPage === 'NUTRITION' ? (
                        <>
                            <CyberPanel title="METABOLIC_CORE" unit="SYS_01">
                                <div className="hardware-inputs">
                                    <div className="input-group" onClick={() => setDialogMode('METRIC_WGT')}>
                                        <label>WGT</label>
                                        <div className="input-value">{stats.weight || '70'} KG</div>
                                    </div>
                                    <div className="input-group" onClick={() => setDialogMode('METRIC_HGT')}>
                                        <label>HGT</label>
                                        <div className="input-value">{stats.height || '175'} CM</div>
                                    </div>
                                    <div className="input-group" onClick={() => setDialogMode('METRIC_AGE')}>
                                        <label>AGE</label>
                                        <div className="input-value">{stats.age || '25'} YRS</div>
                                    </div>
                                    <div className="input-group" onClick={() => setDialogMode('METRIC_GEN')}>
                                        <label>GEN</label>
                                        <div className="input-value">{stats.gender || 'M'}</div>
                                    </div>
                                </div>
                                <div className="goal-selector">
                                    {['CUT', 'MAINTAIN', 'BULK'].map(g => (
                                        <button key={g} className={goal === g ? 'active' : ''} onClick={() => handleGoalChange(g)}>[{g}]</button>
                                    ))}
                                </div>
                                <div className="slider-control">
                                    <div className="slider-header"><label>TARGET_CALORIES (BMR: {baseCalories} KCAL)</label><span className="delta-readout">TARGET: {target} KCAL</span></div>
                                    <input type="range" min="1000" max="4000" value={target} onChange={(e) => {
                                        const newT = parseInt(e.target.value);
                                        setTarget(newT);
                                        localStorage.setItem('cyber_target', newT);
                                        if (window.AndroidHost && window.AndroidHost.syncTarget) {
                                            window.AndroidHost.syncTarget(newT);
                                        }
                                    }} />
                                </div>
                                <div style={{ display: 'flex', gap: '10px', marginBottom: '10px' }}>
                                    <div style={{ flex: 1 }}><ProgressBar current={Math.max(0, netCalories)} target={target} label="NET_CONSUMPTION" /></div>
                                    <div style={{ width: '85px', border: '1px solid var(--border-bright)', padding: '6px', fontSize: '0.62rem', textAlign: 'center', background: 'rgba(0,0,0,0.4)' }}>
                                        BURNED<br/><span style={{ color: 'var(--warning)', fontWeight: 'bold' }}>{burned + protocolBurnOffset} KCAL</span>
                                    </div>
                                </div>

                                <div className="macro-telemetry">
                                    <div className="macro-item"><div className="macro-header"><span>PROTEIN</span><span>{proteinEst}G</span></div><div className="macro-bar"><div className="macro-fill" style={{ width: `${Math.min(100, (proteinEst / 140) * 100)}%` }}></div></div></div>
                                    <div className="macro-item"><div className="macro-header"><span>CARBS</span><span>{carbsEst}G</span></div><div className="macro-bar"><div className="macro-fill" style={{ width: `${Math.min(100, (carbsEst / 220) * 100)}%` }}></div></div></div>
                                    <div className="macro-item"><div className="macro-header"><span>FATS</span><span>{fatEst}G</span></div><div className="macro-bar"><div className="macro-fill" style={{ width: `${Math.min(100, (fatEst / 60) * 100)}%` }}></div></div></div>
                                </div>

                                <div style={{ marginTop: '1rem', textAlign: 'right' }}>
                                    <TerminalButton
                                        label="[ + LOG_INTAKE ]"
                                        onClick={() => {
                                            setActiveUnitId('UNIT_01');
                                            setDialogMode('FOOD');
                                            setInputValue('');
                                        }}
                                    />
                                </div>
                            </CyberPanel>

                            <div className="intake-grid">
                                {intakeUnits.map(unit => {
                                    const unitKcal = unit.items.reduce((sum, item) => sum + item.kcal, 0);
                                    return (
                                        <CyberPanel key={unit.id} title={`${unit.label} [ ${unitKcal} KCAL ]`} unit={unit.id}>
                                            <div className="item-table">
                                                {unit.items.length > 0 ? unit.items.map((item, i) => (
                                                    <div key={i} className="item-row">
                                                        <span style={{ flex: 1 }}>{item.name}</span>
                                                        <span className="item-kcal">{item.kcal} KCAL</span>
                                                        <span className="item-delete" onClick={() => removeItem(unit.id, i)}>X</span>
                                                    </div>
                                                )) : <div className="no-data">STATUS: EMPTY</div>}
                                            </div>
                                            <div className="unit-actions">
                                                <TerminalButton
                                                    label="[ + LOG ]"
                                                    onClick={() => {
                                                        setActiveUnitId(unit.id);
                                                        setDialogMode('FOOD');
                                                        setInputValue('');
                                                    }}
                                                />
                                            </div>
                                        </CyberPanel>
                                    );
                                })}
                            </div>
                        </>
                    ) : (
                        <>
                            <CyberPanel title="KINETIC_OUTPUT" unit="ACT_01">
                                <div style={{ fontSize: '0.7rem', color: 'var(--primary-dim)', marginBottom: '1rem' }}>ENERGY EXPENDITURE LOGGED...</div>
                                <div className="item-table" style={{ minHeight: '100px' }}>
                                    {activities.length > 0 ? activities.map((act, i) => (
                                        <div key={i} className="item-row">
                                            <span style={{ flex: 1 }}>{act.name}</span>
                                            <span style={{ color: '#ffaa00' }}>-{act.kcal} KCAL</span>
                                            <span className="item-delete" onClick={() => removeActivity(i)}>X</span>
                                        </div>
                                    )) : <div className="no-data">STATUS: IDLE</div>}
                                </div>
                                <div className="unit-actions" style={{ marginTop: '1rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                    <div className="activity-theme-trigger" onClick={() => setShowThemeModal(true)}>
                                        ⚙️ THEME
                                    </div>
                                    <TerminalButton
                                        label="[ + LOG_ACTIVITY ]"
                                        onClick={() => {
                                            setDialogMode('ACTIVITY');
                                            setInputValue('');
                                        }}
                                    />
                                </div>
                            </CyberPanel>

                            <CyberPanel title="PAST_PERFORMANCE // 2-DAY ROLLING TELEMETRY" unit="ACT_02">
                                <div style={{ fontSize: '0.62rem', color: 'var(--primary-dim)', marginBottom: '10px' }}>
                                    AUTOMATIC ROLLING LOG // STORES 2 DAYS (FIFO QUEUE):
                                </div>
                                {historyLogs.length > 0 ? (
                                    historyLogs.map((log, idx) => (
                                        <div key={idx} style={{
                                            border: '1px solid var(--border-bright)',
                                            padding: '10px',
                                            marginBottom: idx === historyLogs.length - 1 ? 0 : '10px',
                                            background: 'rgba(0,0,0,0.3)',
                                            borderRadius: '4px'
                                        }}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.68rem', fontWeight: 'bold', marginBottom: '6px' }}>
                                                <span style={{ color: 'var(--primary)' }}>&gt; {log.date}</span>
                                                <span style={{ color: log.consumed > log.target ? 'var(--alert)' : 'var(--primary)' }}>
                                                    {log.consumed} / {log.target} KCAL
                                                </span>
                                            </div>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.58rem', color: 'var(--primary-dim)' }}>
                                                <span>BURNED: -{log.burned} KCAL</span>
                                                <span>MACROS: {log.protein}G P | {log.carbs}G C | {log.fats}G F</span>
                                            </div>
                                        </div>
                                    ))
                                ) : (
                                    <div className="no-data">STATUS: NO PAST HISTORY RECORDED YET (AUTOMATICALLY ROLLS AT MIDNIGHT)</div>
                                )}
                            </CyberPanel>
                        </>
                    )}

                    {showThemeModal && (
                        <div className="terminal-overlay">
                            <div className="terminal-dialog">
                                <div className="prompt">&gt; SELECT HARDWARE_THEME MATRIX...</div>
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', margin: '1.2rem 0' }}>
                                    <button
                                        className="terminal-button"
                                        style={{ border: theme === 'GREEN' ? '2px solid var(--primary)' : '1px solid var(--border)' }}
                                        onClick={() => { toggleTheme('GREEN'); setShowThemeModal(false); }}>
                                        [ PHOSPHOR GREEN // ORIGINAL ]
                                    </button>
                                    <button
                                        className="terminal-button"
                                        style={{ border: theme === 'PURPLE' ? '2px solid var(--primary)' : '1px solid var(--border)', color: '#00f0ff' }}
                                        onClick={() => { toggleTheme('PURPLE'); setShowThemeModal(false); }}>
                                        [ ATOMIC PINK GAME BOY &amp; COBALT PCB ]
                                    </button>
                                    <button
                                        className="terminal-button"
                                        style={{ border: theme === 'BEIGE' ? '2px solid var(--primary)' : '1px solid var(--border)', background: '#E2DDD5', color: '#1A1A1A' }}
                                        onClick={() => { toggleTheme('BEIGE'); setShowThemeModal(false); }}>
                                        [ 80S BEIGE MACINTOSH // ATARI ST ]
                                    </button>
                                </div>
                                <div className="dialog-actions">
                                    <TerminalButton label="ABORT" onClick={() => setShowThemeModal(false)} />
                                </div>
                            </div>
                        </div>
                    )}

                    {splitPickerDay !== null && (
                        <div className="terminal-overlay">
                            <div className="terminal-dialog">
                                <div className="prompt">&gt; REASSIGN SPLIT FOR {dayNames[splitPickerDay]}...</div>
                                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '8px', margin: '1rem 0' }}>
                                    {['PUSH', 'PULL', 'LEGS', 'UPPER', 'LOWER', 'CARDIO', 'REST'].map(s => (
                                        <button
                                            key={s}
                                            className="terminal-button"
                                            onClick={() => handleUpdateSplit(splitPickerDay, s)}>
                                            [{s}]
                                        </button>
                                    ))}
                                </div>
                                <div style={{ marginTop: '1rem', borderTop: '1px dashed var(--border)', paddingTop: '10px' }}>
                                    <div style={{ fontSize: '0.62rem', color: 'var(--primary-dim)', marginBottom: '6px' }}>OR TYPE CUSTOM DAY NAME:</div>
                                    <input
                                        className="terminal-input"
                                        value={customSplitName}
                                        onChange={(e) => setCustomSplitName(e.target.value)}
                                        placeholder="E.G. ARMS & ABS"
                                        style={{ fontSize: '0.85rem' }}
                                    />
                                </div>
                                <div className="dialog-actions" style={{ marginTop: '1rem' }}>
                                    <TerminalButton label="ABORT" onClick={() => { setSplitPickerDay(null); setCustomSplitName(''); }} />
                                    {customSplitName.trim() && (
                                        <TerminalButton
                                            label="[ SAVE CUSTOM NAME ]"
                                            onClick={() => handleUpdateSplit(splitPickerDay, customSplitName.toUpperCase().trim())}
                                        />
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {dialogMode !== null && (
                        <div className="terminal-overlay">
                            <div className="terminal-dialog">
                                <div className="prompt">
                                    &gt; {
                                        dialogMode === 'METRIC_WGT' ? 'UPDATE WEIGHT (KG):' :
                                        dialogMode === 'METRIC_HGT' ? 'UPDATE HEIGHT (CM):' :
                                        dialogMode === 'METRIC_AGE' ? 'UPDATE AGE:' :
                                        dialogMode === 'METRIC_GEN' ? 'UPDATE GENDER (M/F):' :
                                        dialogMode === 'ACTIVITY' ? 'ENTER ACTIVITY (E.G. 1HR GYM):' :
                                        'ENTER FOOD INTAKE (E.G. 50G MILKY BAR OR 200G CHICKEN):'
                                    } <span className="cursor">_</span>
                                </div>
                                <input
                                    autoFocus
                                    className="terminal-input"
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    onKeyDown={handleModalSubmit}
                                    disabled={isOnlineFetching}
                                    placeholder={
                                        dialogMode === 'METRIC_WGT' ? "E.G. 75" :
                                        dialogMode === 'METRIC_HGT' ? "E.G. 180" :
                                        dialogMode === 'METRIC_AGE' ? "E.G. 26" :
                                        dialogMode === 'METRIC_GEN' ? "E.G. M" :
                                        dialogMode === 'ACTIVITY' ? "E.G. 1HR GYM OR 30MIN RUN" :
                                        "E.G. 50G MILKY BAR, 1 MILKY BAR, 200G CHICKEN"
                                    }
                                />
                                {isOnlineFetching && (
                                    <div style={{ fontSize: '0.6rem', color: 'var(--warning)', marginTop: '8px', letterSpacing: '1px' }}>
                                        [ FETCHING LIVE ONLINE NUTRITIONAL TELEMETRY... ]
                                    </div>
                                )}
                                <div className="dialog-actions">
                                    <TerminalButton label="ABORT" onClick={() => { setDialogMode(null); setInputValue(''); }} disabled={isOnlineFetching} />
                                    <TerminalButton
                                        label={
                                            isOnlineFetching ? "[ SEARCHING... ]" :
                                            dialogMode === 'ACTIVITY' ? "[ LOG ACTIVITY ]" :
                                            dialogMode.startsWith('METRIC_') ? "[ UPDATE ]" :
                                            "[ LOG INTAKE ]"
                                        }
                                        onClick={submitDialogForm}
                                        disabled={isOnlineFetching}
                                    />
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bottom-dock">
                        <button className="terminal-button" onClick={() => changePage('PROTOCOL')}>
                            {currentPage === 'PROTOCOL' ? '● PROTOCOL' : 'HUB'}
                        </button>
                        <button className="terminal-button" onClick={() => changePage('NUTRITION')}>
                            {currentPage === 'NUTRITION' ? '● CORE' : 'CORE'}
                        </button>
                        <button className="terminal-button" onClick={() => changePage('ACTIVITY')}>
                            {currentPage === 'ACTIVITY' ? '● ACT' : 'ACT >>'}
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App, null));
    </script>
</body>
</html>
